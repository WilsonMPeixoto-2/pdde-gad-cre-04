name: apply-ci-fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-ci-fixes.py
      - .github/workflows/apply-ci-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/project-hardening-v2.7'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/project-hardening-v2.7
          fetch-depth: 0

      - name: Apply source corrections
        run: python scripts/apply-ci-fixes.py

      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: aplicar correções identificadas pelo CI [ci-fix-bot]"
          git pull --rebase origin chore/project-hardening-v2.7
          git push origin HEAD:chore/project-hardening-v2.7
