name: dependency-lock-sync

on:
  push:
    branches:
      - chore/project-hardening-v2.7
    paths:
      - package.json
      - .github/workflows/dependency-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/project-hardening-v2.7
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincronizar package-lock [lock-sync]"
          git push origin HEAD:chore/project-hardening-v2.7
