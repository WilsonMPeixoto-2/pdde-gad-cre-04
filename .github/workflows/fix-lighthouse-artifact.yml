name: fix-lighthouse-artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-lighthouse-artifact.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/project-hardening-v2.7'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/project-hardening-v2.7
          fetch-depth: 0

      - name: Update artifact path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/quality.yml")
          source = path.read_text(encoding="utf-8")
          old = "          path: .lighthouseci\n"
          new = "          path: output/lighthouse\n"
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          elif new not in source:
              raise SystemExit("Caminho Lighthouse esperado não encontrado.")
          PY

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Caminho já atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality.yml
          git commit -m "ci: preservar relatórios do Lighthouse 13"
          git pull --rebase origin chore/project-hardening-v2.7
          git push origin HEAD:chore/project-hardening-v2.7
