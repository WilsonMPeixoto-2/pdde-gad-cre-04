name: fix-sei-link

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-sei-link.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/project-hardening-v2.7'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/project-hardening-v2.7
          fetch-depth: 0

      - name: Replace unstable direct route with official guides hub
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/externalResources.ts")
          source = path.read_text(encoding="utf-8")
          old = "https://sei.rio/servidor/capacitacao/guia-do-usuario-interno/"
          new = "https://sei.rio/servidor/guias-e-ambiente-de-teste/"
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          elif new not in source:
              raise SystemExit("URL esperada não encontrada.")
          PY

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "URL já corrigida."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/externalResources.ts
          git commit -m "fix: usar hub oficial estável dos guias do SEI!RIO"
          git pull --rebase origin chore/project-hardening-v2.7
          git push origin HEAD:chore/project-hardening-v2.7
