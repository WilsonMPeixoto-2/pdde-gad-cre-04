name: hardening-apply

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-project-hardening.py
      - package.json
      - .github/workflows/hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/project-hardening-v2.7'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: chore/project-hardening-v2.7
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic transformations
        run: python scripts/apply-project-hardening.py

      - name: Synchronize npm dependencies
        run: npm install --ignore-scripts

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma transformação pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: aplicar saneamento técnico automatizado [hardening-bot]"
          git push origin HEAD:chore/project-hardening-v2.7
