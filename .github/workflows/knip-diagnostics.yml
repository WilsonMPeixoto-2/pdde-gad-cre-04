name: knip-diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - knip.json
      - package.json
      - .github/workflows/knip-diagnostics.yml

jobs:
  audit:
    if: github.head_ref == 'chore/project-hardening-v2.7'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Knip diagnostics
        shell: bash
        run: |
          mkdir -p output/knip
          npm run audit:unused > output/knip/knip.log 2>&1 || true
          cat output/knip/knip.log

      - name: Upload Knip diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: knip-diagnostics
          path: output/knip/knip.log
          if-no-files-found: error
          retention-days: 7
